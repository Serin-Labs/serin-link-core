# hvac_link: (lambda) and hvac_link_sensor: (binary_sensor id) answer the
# same question; setting both must be rejected rather than silently picking one.
esphome:
  name: t-hvac-both

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

wifi:
  ssid: "test"
  password: "testpass123"

external_components:
  - source:
      type: local
      path: ../../esphome/components
    components: [serin_link]

serin_link:
  id: serin
  hvac_link: !lambda 'return true;'
  hvac_link_sensor: hp_ok

binary_sensor:
  - platform: template
    id: hp_ok
    name: "HP OK"
