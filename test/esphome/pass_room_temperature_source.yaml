# room_temperature_source: — the single controller-owned dropdown that picks
# which reading feeds the room temperature. Options are Internal, Auto (last
# reporting), and one row per bond slot, so max_links: sizes it the same way it
# sizes the diagnostics rows. The same selection is what paired Serin Links
# show, via the v4 catalog.
esphome:
  name: t-room-temperature-source

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

wifi:
  ssid: "test"
  password: "testpass123"

logger:

external_components:
  - source:
      type: local
      path: ../../esphome/components
    components: [serin_link]

serin_link:
  id: serin
  max_links: 2
  link_sensor:
    temperature:
      name: "Serin Link Temperature"
  room_temperature_source:
    name: "Room Temperature Source"
