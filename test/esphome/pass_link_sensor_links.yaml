# Per-slot link_sensor rows, generated: bare `links:` under link_sensor:
# expands to one temperature + one humidity entity per bond slot, sized by
# max_links and scoped to the link_devices sub-devices (short names).
esphome:
  name: t-sensor-links
  devices:
    - id: link1
      name: "Serin Link 1"
    - id: link2
      name: "Serin Link 2"

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

wifi:
  ssid: "test"
  password: "testpass123"

logger:

external_components:
  - source:
      type: local
      path: ../../esphome/components
    components: [serin_link]

serin_link:
  id: serin
  max_links: 2
  link_devices: [link1, link2]
  link_sensor:
    links:
