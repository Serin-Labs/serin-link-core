# primary_select: was removed along with the automatic "last reporting" room
# source; room_temperature_source: (with sources: for external readings)
# replaces it.
esphome:
  name: t-primary-select-removed

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

wifi:
  ssid: "test"
  password: "testpass123"

logger:

external_components:
  - source:
      type: local
      path: ../../esphome/components
    components: [serin_link]

serin_link:
  id: serin
  link_sensor:
    temperature:
      name: "Serin Link Temperature"
    primary_select:
