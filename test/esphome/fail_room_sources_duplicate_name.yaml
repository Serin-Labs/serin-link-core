# Two `sources:` entries that resolve to the same label collide in the
# dropdown and in the dial's catalog — reject rather than let one shadow the
# other silently.
esphome:
  name: t-room-sources-dup

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

wifi:
  ssid: "test"
  password: "testpass123"

logger:

external_components:
  - source:
      type: local
      path: ../../esphome/components
    components: [serin_link]

sensor:
  - platform: template
    id: a_temp
    name: "Home Assistant"
  - platform: template
    id: b_temp
    name: "Other"

serin_link:
  id: serin
  link_sensor:
    temperature:
      name: "Serin Link Temperature"
  room_temperature_source:
    sources:
      - sensor: a_temp
      - sensor: b_temp
        name: "Home Assistant"
