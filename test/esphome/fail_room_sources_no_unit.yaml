# A homeassistant sensor does not inherit its entity's unit, so a `sources:`
# sensor with no unit_of_measurement could be a °F reading taken as °C.
# Make the config say which.
esphome:
  name: t-room-sources-unit

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

wifi:
  ssid: "test"
  password: "testpass123"

logger:

external_components:
  - source:
      type: local
      path: ../../esphome/components
    components: [serin_link]

sensor:
  - platform: template
    id: room_temp
    name: "Home Assistant"

serin_link:
  id: serin
  link_sensor:
    temperature:
      name: "Serin Link Temperature"
  room_temperature_source:
    sources:
      - sensor: room_temp
