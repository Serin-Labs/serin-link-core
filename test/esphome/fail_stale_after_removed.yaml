# stale_after: was a knob nobody had a basis to set — the value derives from
# the Serin Link's fixed 20 s report cadence, a wire constant, not a user
# preference. Removed in v0.1.3-beta.11; the schema must say so, not just
# "invalid option".
esphome:
  name: t-stale-after-removed

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

wifi:
  ssid: "test"
  password: "testpass123"

external_components:
  - source:
      type: local
      path: ../../esphome/components
    components: [serin_link]

serin_link:
  id: serin
  link_sensor:
    stale_after: 60s
