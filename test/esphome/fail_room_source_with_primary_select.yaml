# room_temperature_source: supersedes link_sensor: primary_select: — they are
# two dropdowns editing one stored choice, so setting both must be rejected
# rather than silently letting one win.
esphome:
  name: t-room-source-both

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

wifi:
  ssid: "test"
  password: "testpass123"

external_components:
  - source:
      type: local
      path: ../../esphome/components
    components: [serin_link]

serin_link:
  id: serin
  max_links: 2
  link_sensor:
    temperature:
      name: "Serin Link Temperature"
    primary_select:
  room_temperature_source:
    name: "Room Temperature Source"
