# Bare `links:` with nothing to size it from (no max_links, no link_devices)
# must be rejected — the component cannot guess how many slots to generate.
esphome:
  name: t-sensor-links-nocount

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

wifi:
  ssid: "test"
  password: "testpass123"

external_components:
  - source:
      type: local
      path: ../../esphome/components
    components: [serin_link]

serin_link:
  id: serin
  link_sensor:
    links:
