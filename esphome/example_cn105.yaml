# Serin Link + echavet/MitsubishiCN105ESPHome on one ESP32, spelled out.
# (For the short form of this exact config, see example_package.yaml.)
#
# The SL2 path (pairing, CAPS, STATE, commands into the cn105 ClimateCall)
# was VERIFIED ON HARDWARE 2026-07-10 (M5Stack AtomS3 Lite, ESPHome 2026.6.5,
# IDF 5.5). The multi-link keys used below (max_links, link_devices,
# pair_button, connected, on_room_temperature, hvac_link_sensor) landed
# later and are compile- and schema-verified.
#
# Adding serin_link to an existing echavet config is three edits:
#   1. framework: type: esp-idf        (required)
#   2. add the serin_link external_component
#   3. give the climate entity an `id:` and add the `serin_link:` block
# Do NOT add an `espnow:` block — serin_link owns the radio and config
# validation rejects it.

esphome:
  name: serin-cn105
  friendly_name: Living Room
  # Sub-devices: each bonded Serin Link gets its own device in Home Assistant,
  # so its entities group under "Serin Link 1" instead of sitting in a flat
  # list beside the heat pump's. Referenced by link_devices: below, which is
  # what scopes the generated per-Link entities to them.
  devices:
    - id: link1
      name: "Serin Link 1"
    - id: link2
      name: "Serin Link 2"

esp32:
  board: m5stack-atoms3
  framework:
    type: esp-idf   # required: raw nvs_*, esp_now encrypted peers

external_components:
  - source: github://echavet/MitsubishiCN105ESPHome
  - source:
      type: local
      path: ../esphome/components
      # off-repo: github://Serin-Labs/serin-link-core@v0.1.3-beta.9 (first
      # tag with the multi-link keys)
    components: [serin_link]

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # serin_link forces power-save off at runtime anyway (ESP-NOW RX needs the
  # radio awake), but setting it here keeps the intent visible.
  power_save_mode: NONE

logger:
api:
ota:
  - platform: esphome

uart:
  id: HP_UART
  baud_rate: 2400
  parity: EVEN
  rx_pin: GPIO2      # AtomS3 Lite grove; use GPIO16/17 on a plain ESP32
  tx_pin: GPIO1

climate:
  - platform: cn105
    id: hvac         # <- serin_link binds this
    name: "Living Room"
    update_interval: 2s
    remote_temperature_timeout: 3min   # cn105 reverts to its internal
                                       # thermistor if the Serin Link goes quiet
    # Vanes: cn105 exposes them as select entities; give them ids and bind
    # them below so the Serin Link gets both axes (option order = wire positions,
    # "auto"/"swing" options map to the wire AUTO/SWING codes).
    vertical_vane_select:
      name: "Vertical Vane"
      id: vane_v
    horizontal_vane_select:
      name: "Horizontal Vane"
      id: vane_h
    # Telemetry the Serin Link can show (INFO TLVs) — give the platform's sensor
    # blocks ids and bind them in serin_link: below.
    outside_air_temperature_sensor:
      name: "Outside Air Temp"
      id: oat
    compressor_frequency_sensor:
      name: "Compressor Frequency"
      id: comp_hz
      entity_category: diagnostic
    stage_sensor:
      name: "Stage"
      id: stage
      entity_category: diagnostic
    sub_mode_sensor:
      name: "Sub Mode"
      id: sub_mode
      entity_category: diagnostic
    auto_sub_mode_sensor:
      name: "Auto Sub Mode"
      id: auto_sub
      entity_category: diagnostic
    input_power_sensor:
      name: "Input Power"
      id: input_w
      entity_category: diagnostic
    kwh_sensor:
      name: "Energy Used"
      id: kwh_total
      entity_category: diagnostic
    runtime_hours_sensor:
      name: "Runtime Hours"
      id: runtime_h
      entity_category: diagnostic

serin_link:
  id: serin          # NB: `id: link` collides with libc link() in generated code
  climate_id: hvac
  # zone_name: "Living Room"   # defaults to the climate entity's name
  # How many Serin Links this install holds — the single source of truth.
  # Generates the four per-slot diagnostics entities (MAC / Connected /
  # Last Seen / Firmware) for each slot and sizes the primary-Link dropdown.
  # A slot is a bond-table POSITION: forgetting a Link compacts the table and
  # shifts later Links down, which is why every generated row includes MAC.
  max_links: 2
  # One esphome:-devices: id per slot, in slot order — scopes each slot's
  # generated entities to its sub-device with short names ("MAC" under
  # "Serin Link 1"). Omit it and the entities land flat on the controller
  # with prefixed names ("Serin Link 1 MAC").
  link_devices: [link1, link2]
  # Device-link health -> the Serin Link's offline face + System "No link". Without
  # this, a dead CN105 UART is invisible: the climate entity keeps existing,
  # so the Serin Link would show "Connected" with a frozen (or 0°) temperature.
  # A platform exposing this as a binary_sensor can bind hvac_link_sensor:
  # instead (one or the other, never both). Omit both on platforms with no
  # such signal — the fallback heuristic (room temperature NaN = never heard
  # from the device) still catches the never-connected case.
  hvac_link: !lambda 'return id(hvac).isHeatpumpConnected();'
  vane_v_select: vane_v
  vane_h_select: vane_h
  # Telemetry -> the Serin Link's INFO pages (outside temp, compressor, energy,
  # runtime). Bind any sensors you like — these are the cn105 ones above.
  # A battery_sensor (any % sensor, e.g. a BLE room sensor imported from HA)
  # additionally drives the Serin Link's low-battery chip.
  outside_temp_sensor: oat
  compressor_hz_sensor: comp_hz
  stage_sensor: stage
  sub_mode_sensor: sub_mode
  auto_sub_mode_sensor: auto_sub
  runtime_sensor: runtime_h
  power_sensor: input_w
  energy_sensor: kwh_total
  # Component-owned Pair button (bare form gets the default name and 60s).
  pair_button:
    window: 60s
  diagnostics:
    connected:       # "any bonded Serin Link alive", default name
    pairing_status:
      name: "Pairing"
  # The Serin Link's own SHT4x, published to Home Assistant and offered to the
  # heat pump as a room-temperature source. Adding this block is what makes the
  # Serin Link transmit at all, and what puts the source cycle in its Settings.
  link_sensor:
    temperature:
      name: "Serin Link Temperature"
    humidity:
      name: "Serin Link Humidity"
    # With more than one Serin Link bonded, pin which one feeds the entities
    # above — otherwise whichever reported last wins, and the value (plus the
    # heat pump fed from it) alternates between rooms. The dropdown offers
    # Auto + one entry per max_links slot, persists by MAC, and follows its
    # Link when a forget renumbers the slots.
    primary_select:
    # Feed the heat pump the Serin Link's reading. Fires only for a fresh,
    # non-NaN reading from the arbitrated primary Link while the Serin Link
    # is the selected room source — cycling back to Internal on it stops the
    # feed, no conditions needed here.
    on_room_temperature:
      - lambda: 'id(hvac).set_remote_temperature(x);'

button:
  # Forgetting drops ONE Serin Link. slot: 0 is the first bond; because
  # forgetting compacts the table, the Link that was in slot 1 becomes slot 0
  # afterwards — watch the per-slot MAC entities to see it happen. Target a
  # specific Link regardless of slot with mac_address: instead.
  - platform: template
    name: "Forget Serin Link 1"
    on_press:
      - serin_link.forget_link:
          slot: 0
  - platform: template
    name: "Forget All Serin Links"
    on_press:
      - serin_link.forget_all_links:

# Known gaps against a native Serin Controller:
#  - Link OTA credential relay: not wired (dial hides its update entry).
