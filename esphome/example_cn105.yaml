# Serin Link + echavet/MitsubishiCN105ESPHome on one ESP32.
#
# VERIFIED ON HARDWARE 2026-07-10 (M5Stack AtomS3 Lite, ESPHome 2026.6.5,
# IDF 5.5): the Serin Link pairs, pulls CAPS (zone name comes from the climate
# entity), streams STATE, and its mode/setpoint/fan commands route into the
# cn105 climate entity via ClimateCall.
#
# Adding serin_link to an existing echavet config is three edits:
#   1. framework: type: esp-idf        (required)
#   2. add the serin_link external_component
#   3. give the climate entity an `id:` and add the `serin_link:` block
# Do NOT add an `espnow:` block — serin_link owns the radio and config
# validation rejects it.

esphome:
  name: serin-cn105
  friendly_name: Living Room
  # Sub-devices: each bonded Serin Link gets its own device in Home Assistant,
  # so its entities group under "Serin Link 1" instead of sitting in a flat
  # list beside the heat pump's. Pure config — the component is unaware.
  devices:
    - id: link1
      name: "Serin Link 1"
    - id: link2
      name: "Serin Link 2"

esp32:
  board: m5stack-atoms3
  framework:
    type: esp-idf   # required: raw nvs_*, esp_now encrypted peers

external_components:
  - source: github://echavet/MitsubishiCN105ESPHome
  - source:
      type: local
      path: ../esphome/components
      # no published tag has the telemetry keys below yet (v0.1.2 predates
      # them); TODO(release): once one ships, point this at
      # github://Serin-Labs/serin-link-core@vX.Y.Z instead.
    components: [serin_link]

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # serin_link forces power-save off at runtime anyway (ESP-NOW RX needs the
  # radio awake), but setting it here keeps the intent visible.
  power_save_mode: NONE

logger:
api:
ota:
  - platform: esphome

uart:
  id: HP_UART
  baud_rate: 2400
  parity: EVEN
  rx_pin: GPIO2      # AtomS3 Lite grove; use GPIO16/17 on a plain ESP32
  tx_pin: GPIO1

climate:
  - platform: cn105
    id: hvac         # <- serin_link binds this
    name: "Living Room"
    update_interval: 2s
    remote_temperature_timeout: 3min   # cn105 reverts to its internal
                                       # thermistor if the Serin Link goes quiet
    # Vanes: cn105 exposes them as select entities; give them ids and bind
    # them below so the Serin Link gets both axes (option order = wire positions,
    # "auto"/"swing" options map to the wire AUTO/SWING codes).
    vertical_vane_select:
      name: "Vertical Vane"
      id: vane_v
    horizontal_vane_select:
      name: "Horizontal Vane"
      id: vane_h
    # Telemetry the Serin Link can show (INFO TLVs) — give the platform's sensor
    # blocks ids and bind them in serin_link: below.
    outside_air_temperature_sensor:
      name: "Outside Air Temp"
      id: oat
    compressor_frequency_sensor:
      name: "Compressor Frequency"
      id: comp_hz
      entity_category: diagnostic
    stage_sensor:
      name: "Stage"
      id: stage
      entity_category: diagnostic
    sub_mode_sensor:
      name: "Sub Mode"
      id: sub_mode
      entity_category: diagnostic
    auto_sub_mode_sensor:
      name: "Auto Sub Mode"
      id: auto_sub
      entity_category: diagnostic
    input_power_sensor:
      name: "Input Power"
      id: input_w
      entity_category: diagnostic
    kwh_sensor:
      name: "Energy Used"
      id: kwh_total
      entity_category: diagnostic
    runtime_hours_sensor:
      name: "Runtime Hours"
      id: runtime_h
      entity_category: diagnostic

serin_link:
  id: serin          # NB: `id: link` collides with libc link() in generated code
  climate_id: hvac
  # zone_name: "Living Room"   # defaults to the climate entity's name
  # Device-link health -> the Serin Link's offline face + System "No link". Without
  # this, a dead CN105 UART is invisible: the climate entity keeps existing,
  # so the Serin Link would show "Connected" with a frozen (or 0°) temperature.
  # Omit the line entirely on platforms with no such signal — the fallback
  # heuristic (room temperature NaN = never heard from the device) still
  # catches the never-connected case.
  hvac_link: !lambda 'return id(hvac).isHeatpumpConnected();'
  vane_v_select: vane_v
  vane_h_select: vane_h
  # Telemetry -> the Serin Link's INFO pages (outside temp, compressor, energy,
  # runtime). Bind any sensors you like — these are the cn105 ones above.
  # A battery_sensor (any % sensor, e.g. a BLE room sensor imported from HA)
  # additionally drives the Serin Link's low-battery chip.
  outside_temp_sensor: oat
  compressor_hz_sensor: comp_hz
  stage_sensor: stage
  sub_mode_sensor: sub_mode
  auto_sub_mode_sensor: auto_sub
  runtime_sensor: runtime_h
  power_sensor: input_w
  energy_sensor: kwh_total
  # The Serin Link's own SHT4x, published to Home Assistant and offered to the
  # heat pump as a room-temperature source. Adding this block is what makes the
  # Serin Link transmit at all, and what puts the source cycle in its Settings.
  link_sensor:
    temperature:
      id: dial_temp
      name: "Serin Link Temperature"
      # Feed the heat pump ONLY while the Serin Link is the selected source —
      # cycling back to Internal on it must actually hand control back.
      # The stale edge (§2 of the design doc) publishes NAN; guard it here
      # rather than assume the platform does — cn105 upstream happens to,
      # but this recipe is copied to platforms that may not.
      on_value:
        - if:
            condition:
              lambda: 'return !std::isnan(x) && id(serin).room_src_is_link();'
            then:
              - lambda: 'id(hvac).set_remote_temperature(x);'
    humidity:
      name: "Serin Link Humidity"
    # With more than one Serin Link bonded, pin which one feeds the entities
    # above — otherwise whichever reported last wins, and the value (plus the
    # heat pump fed from it via the on_value recipe) alternates between rooms.
    #
    # primary_select: is the runtime form: a Home Assistant dropdown listing
    # Auto / Serin Link 1..4, persisted by MAC so it survives a reboot and
    # follows its Link when a forget renumbers the slots. Use
    # primary_link: "AA:BB:.." instead to pin it in the config — the two are
    # mutually exclusive.
    primary_select:
      name: "Primary Serin Link"

  # Which Serin Links are bonded, and are they alive. A row is a bond SLOT, not
  # a Serin Link: forgetting one shifts the later ones down, so declare
  # mac_address on every row — that is what makes the shift visible instead of
  # quietly relabelling a row with another Link's identity.
  diagnostics:
    bonded_count:
      name: "Bonded Serin Links"
    pairing_status:
      name: "Pairing"
    pairing_seconds:
      name: "Pairing Window"
    links:
      - mac_address:
          name: "MAC"
          device_id: link1
        linked:
          name: "Connected"
          device_id: link1
        last_seen:
          name: "Last Seen"
          device_id: link1
        firmware:
          name: "Firmware"
          device_id: link1
      - mac_address:
          name: "MAC"
          device_id: link2
        linked:
          name: "Connected"
          device_id: link2
        last_seen:
          name: "Last Seen"
          device_id: link2
        firmware:
          name: "Firmware"
          device_id: link2
button:
  - platform: template
    name: "Pair Serin Link"
    on_press:
      - serin_link.pair_start:
          window: 60s
  # Drops ONE dial. slot: 0 is the first bond; because forgetting compacts the
  # table, the Serin Link that was in slot 1 becomes slot 0 afterwards — watch the
  # Dial N MAC entities to see it happen.
  - platform: template
    name: "Forget Serin Link 1"
    on_press:
      - serin_link.forget_link:
          slot: 0
  - platform: template
    name: "Forget All Serin Links"
    on_press:
      - serin_link.forget_all_links:

binary_sensor:
  - platform: template
    name: "Serin Link Connected"
    lambda: 'return id(serin).any_dial_live();'

# Known gaps against a native Serin Controller:
#  - Link OTA credential relay: not wired (dial hides its update entry).
