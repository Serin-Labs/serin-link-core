# Serin Link coexistence spike.
#
# Purpose: prove that serin_link's raw ESP-NOW (encrypted peers + broadcast
# pairing) coexists with ESPHome's Wi-Fi STA + native API on real hardware,
# and that a real Serin Link can pair with it and lock on.
#
# Flash to any spare ESP32-S3 (adjust `board:`). Then on a Serin Link:
# open pairing on the Serin Link while pressing the "Pair Serin Link" button here.
#
# NOTE: no `espnow:` block — serin_link owns the radio and the config
# validator rejects the built-in component (it has no link-layer encryption).

esphome:
  name: serin-spike
  friendly_name: Serin Link Spike

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf   # required: raw nvs_*, esp_now encrypted peers

external_components:
  - source:
      type: local
      path: ../esphome/components   # in-repo; or github://Serin-Labs/serin-link-core@v0.1.1
    components: [serin_link]

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

serin_link:
  id: serin
  zone_name: "Spike Bench"
  # No climate entity to feed here, but this exercises the link_sensor:
  # codegen path (owned sensor/text_sensor entities + stale_after) so CI
  # compiles it.
  link_sensor:
    temperature:
      name: "Spike Serin Link Temperature"
    humidity:
      name: "Spike Serin Link Humidity"
    link_mac:
      name: "Reporting Serin Link"
    stale_after: 60s
    # With two Serin Links bonded, whichever reported last owns the entities
    # above. Pin one to stop the value alternating between rooms — as a Home
    # Assistant dropdown here, or with primary_link: "AA:BB:.." in the config
    # (the two are mutually exclusive).
    primary_select:
      name: "Primary Serin Link"

  # Visibility into the bond table. A row is a bond SLOT, not a Serin Link:
  # forgetting one Serin Link shifts the later ones down, which is why every row
  # declares mac_address — it makes that shift visible in HA instead of
  # silently relabelling "Serin Link 2" with Link 3's identity.
  diagnostics:
    bonded_count:
      name: "Bonded Serin Links"
    pairing_status:
      name: "Pairing"
    pairing_seconds:
      name: "Pairing Window"
    links:
      - mac_address:
          name: "Serin Link 1 MAC"
        linked:
          name: "Serin Link 1 Linked"
        last_seen:
          name: "Serin Link 1 Last Seen"
        firmware:
          name: "Serin Link 1 Firmware"
      - mac_address:
          name: "Serin Link 2 MAC"
        linked:
          name: "Serin Link 2 Linked"
        last_seen:
          name: "Serin Link 2 Last Seen"
        firmware:
          name: "Serin Link 2 Firmware"

button:
  - platform: template
    name: "Pair Serin Link"
    on_press:
      - serin_link.pair_start:
          window: 60s
  - platform: template
    name: "Cancel Pairing"
    on_press:
      - serin_link.pair_cancel:
  - platform: template
    name: "Forget Serin Link 1"
    on_press:
      - serin_link.forget_link:
          slot: 0
  - platform: template
    name: "Forget All Serin Links"
    on_press:
      - serin_link.forget_all_links:

binary_sensor:
  - platform: template
    name: "Serin Link Connected"
    lambda: 'return id(serin).any_dial_live();'

text_sensor:
  - platform: template
    name: "Pair Result"
    update_interval: 2s
    lambda: 'return std::string(id(serin).pair_result());'
