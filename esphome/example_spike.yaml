# Serin Link coexistence spike.
#
# Purpose: prove that serin_link's raw ESP-NOW (encrypted peers + broadcast
# pairing) coexists with ESPHome's Wi-Fi STA + native API on real hardware,
# and that a real Serin dial can pair with it and lock on.
#
# Flash to any spare ESP32-S3 (adjust `board:`). Then on a Serin dial:
# open pairing on the dial while pressing the "Pair Serin Dial" button here.
#
# NOTE: no `espnow:` block — serin_link owns the radio and the config
# validator rejects the built-in component (it has no link-layer encryption).

esphome:
  name: serin-spike
  friendly_name: Serin Link Spike

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf   # required: raw nvs_*, esp_now encrypted peers

external_components:
  - source:
      type: local
      path: ../esphome/components   # in-repo; or github://Serin-Labs/serin-link-core@v0.1.1
    components: [serin_link]

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

serin_link:
  id: serin
  zone_name: "Spike Bench"
  # No climate entity to feed here, but this exercises the link_sensor:
  # codegen path (owned sensor/text_sensor entities + stale_after) so CI
  # compiles it.
  link_sensor:
    temperature:
      name: "Spike Dial Temperature"
    humidity:
      name: "Spike Dial Humidity"
    dial_mac:
      name: "Spike Dial"
    stale_after: 60s
    # With two dials bonded, whichever reported last owns the entities above.
    # Pin one to stop the value alternating between rooms:
    # primary_dial: "10:51:DB:8E:EB:38"

  # Visibility into the bond table. A row is a bond SLOT, not a dial:
  # forgetting one dial shifts the later ones down, which is why every row
  # declares mac_address — it makes that shift visible in HA instead of
  # silently relabelling "Dial 2" with dial 3's identity.
  diagnostics:
    bonded_count:
      name: "Bonded Dials"
    pairing_status:
      name: "Pairing"
    pairing_seconds:
      name: "Pairing Window"
    dials:
      - mac_address:
          name: "Dial 1 MAC"
        linked:
          name: "Dial 1 Linked"
        last_seen:
          name: "Dial 1 Last Seen"
        firmware:
          name: "Dial 1 Firmware"
      - mac_address:
          name: "Dial 2 MAC"
        linked:
          name: "Dial 2 Linked"
        last_seen:
          name: "Dial 2 Last Seen"
        firmware:
          name: "Dial 2 Firmware"

button:
  - platform: template
    name: "Pair Serin Dial"
    on_press:
      - serin_link.pair_start:
          window: 60s
  - platform: template
    name: "Cancel Pairing"
    on_press:
      - serin_link.pair_cancel:
  - platform: template
    name: "Forget Dial 1"
    on_press:
      - serin_link.forget_dial:
          slot: 0
  - platform: template
    name: "Forget All Dials"
    on_press:
      - serin_link.forget_all_dials:

binary_sensor:
  - platform: template
    name: "Serin Dial Linked"
    lambda: 'return id(serin).any_dial_live();'

text_sensor:
  - platform: template
    name: "Pair Result"
    update_interval: 2s
    lambda: 'return std::string(id(serin).pair_result());'
