# Serin Link on a GENERIC ESPHome climate device.
#
# The dial pairs with this node and controls whatever `climate_id` points at —
# any ESPHome climate platform (thermostat, midea, daikin, gree, ...). CAPS
# derive from the entity's traits: the dial's mode ring shows only the modes
# this entity supports, the setpoint clamps to its visual range, fan detents
# follow its discrete fan modes.

esphome:
  name: serin-zone
  friendly_name: Guest Room

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf   # required: raw nvs_*, esp_now encrypted peers

external_components:
  - source:
      type: local
      path: ../esphome/components
      # no published tag has the telemetry keys below yet (v0.1.2 predates
      # them); TODO(release): once one ships, point this at
      # github://Serin-Labs/serin-link-core@vX.Y.Z instead.
    components: [serin_link]

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
api:
ota:
  - platform: esphome

# Any climate platform works. `thermostat` shown as the generic example, its
# sensor: wired to the dial's own reading (dial_temp, declared under
# serin_link: below).
#
# Non-dial alternative: an existing HA sensor as the control temperature —
# swap this back in for `sensor: dial_temp` below if you'd rather not have
# the dial drive the thermostat.
# sensor:
#   - platform: homeassistant
#     id: room_temp
#     entity_id: sensor.guest_room_temperature

climate:
  - platform: thermostat
    id: hvac
    name: "Guest Room"
    sensor: dial_temp
    min_heating_off_time: 300s
    min_heating_run_time: 300s
    min_idle_time: 30s
    heat_action:
      - switch.turn_on: heater
    idle_action:
      - switch.turn_off: heater
    default_preset: Home
    preset:
      - name: Home
        default_target_temperature_low: 20 °C

switch:
  - platform: gpio
    id: heater
    pin: GPIO5

serin_link:
  id: serin
  climate_id: hvac
  # zone_name: "Guest Room"   # defaults to the entity/friendly name
  # hvac_link: !lambda '...'  # bind your platform's device-link health if it
  #                           # has one (see example_cn105.yaml); unset, a NaN
  #                           # room temp on an entity that claims one reports
  #                           # the link down (never-heard-from-device)
  # The dial's own sensor — climate.sensor: above already points straight at
  # dial_temp, no automation needed on this platform. Two ways this differs
  # from cn105's recipe, both worth knowing before you deploy it:
  #   - `thermostat` has exactly one sensor input, no internal thermistor
  #     behind it, so there's nothing for the dial's Internal/Link cycle to
  #     switch between here — the dial just IS the control sensor.
  #   - No remote_temperature_timeout equivalent: if the dial goes stale,
  #     the entity's temperature goes unknown rather than falling back.
  link_sensor:
    temperature:
      id: dial_temp
      name: "Serin Link Temperature"
    humidity:
      name: "Serin Link Humidity"
    # Which dial is feeding. Only interesting when two dials bonded to one
    # controller both offer a sensor: last reporting dial wins, so the value
    # alternates and this names the culprit.
    link_mac:
      name: "Serin Link"

button:
  - platform: template
    name: "Pair Serin Link"
    on_press:
      - lambda: 'id(serin).pair_start(60000);'
  - platform: template
    name: "Forget All Serin Links"
    on_press:
      - lambda: 'id(serin).forget_all_dials();'

binary_sensor:
  - platform: template
    name: "Serin Link Connected"
    lambda: 'return id(serin).any_dial_live();'
