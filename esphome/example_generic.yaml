# Serin Link on a GENERIC ESPHome climate device.
#
# The Serin Link pairs with this node and controls whatever `climate_id` points at —
# any ESPHome climate platform (thermostat, midea, daikin, gree, ...). CAPS
# derive from the entity's traits: the Serin Link's mode ring shows only the modes
# this entity supports, the setpoint clamps to its visual range, fan detents
# follow its discrete fan modes.

esphome:
  name: serin-zone
  friendly_name: Guest Room

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf   # required: raw nvs_*, esp_now encrypted peers

external_components:
  - source:
      type: local
      path: ../esphome/components
      # Outside this checkout, replace the source mapping with:
      # source: github://Serin-Labs/serin-link-core@v0.1.6
    components: [serin_link]

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
api:
ota:
  - platform: esphome

# Any climate platform works. `thermostat` shown as the generic example, its
# sensor: wired to the Serin Link's own reading (dial_temp, declared under
# serin_link: below).
#
# Non-Link alternative: an existing HA sensor as the control temperature —
# swap this back in for `sensor: dial_temp` below if you'd rather not have
# the Serin Link drive the thermostat.
# sensor:
#   - platform: homeassistant
#     id: room_temp
#     entity_id: sensor.guest_room_temperature

climate:
  - platform: thermostat
    id: hvac
    name: "Guest Room"
    sensor: dial_temp
    min_heating_off_time: 300s
    min_heating_run_time: 300s
    min_idle_time: 30s
    heat_action:
      - switch.turn_on: heater
    idle_action:
      - switch.turn_off: heater
    default_preset: Home
    preset:
      - name: Home
        default_target_temperature_low: 20 °C

switch:
  - platform: gpio
    id: heater
    pin: GPIO5

serin_link:
  id: serin
  climate_id: hvac
  # zone_name: "Guest Room"   # defaults to the entity/friendly name
  # hvac_link: !lambda '...'  # bind your platform's device-link health if it
  #                           # has one (see example_cn105.yaml); unset, a NaN
  #                           # room temp on an entity that claims one reports
  #                           # the link down (never-heard-from-device)
  # The thermostat uses dial_temp directly as its control sensor. It has no
  # internal thermistor or remote-temperature timeout to provide a fallback.
  # Choosing Heat pump in the Link's Room Sensor menu does not change this
  # direct sensor binding. If the Link's reading becomes unknown, the
  # thermostat requests OFF, subject to the minimum run times configured
  # above. An active heater may therefore continue until its five-minute
  # minimum run time has elapsed.
  link_sensor:
    temperature:
      id: dial_temp
      name: "Serin Link Temperature"
    humidity:
      name: "Serin Link Humidity"

button:
  - platform: template
    name: "Pair Serin Link"
    on_press:
      - lambda: 'id(serin).pair_start(60000);'
  - platform: template
    name: "Forget All Serin Links"
    on_press:
      - lambda: 'id(serin).forget_all_dials();'

binary_sensor:
  - platform: template
    name: "Serin Link Connected"
    lambda: 'return id(serin).any_dial_live();'
