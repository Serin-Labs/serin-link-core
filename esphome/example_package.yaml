# A complete two-Serin-Link CN105 controller via the packaged recipe — this
# file is the whole device config. Everything zone-shaped (UART, climate
# entity, serin_link binding, pairing button, diagnostics, room-sensor feed)
# lives in packages/cn105.yaml; override any of it by redeclaring the key here.
#
# Off-repo, replace the local includes with:
#   packages:
#     serin_cn105: github://Serin-Labs/serin-link-core/esphome/packages/cn105.yaml@v0.1.3-beta.9

substitutions:
  zone_name: "Living Room"
  max_links: "2"

esphome:
  name: serin-living
  friendly_name: Living Room

esp32:
  board: m5stack-atoms3
  framework:
    type: esp-idf   # required: raw nvs_*, esp_now encrypted peers

external_components:
  - source: github://echavet/MitsubishiCN105ESPHome
  - source:
      type: local
      path: ../esphome/components
      # off-repo: github://Serin-Labs/serin-link-core@v0.1.3-beta.9 (first
      # tag with the multi-link keys)
    components: [serin_link]

packages:
  serin_cn105: !include packages/cn105.yaml

serin_link:
  # Let a bonded Serin Link fetch its own firmware — relays this node's Wi-Fi
  # credentials to it on request. See README, "Letting the Serin Link update
  # itself", for what that hands to whom.
  # link_ota_credentials: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
api:
ota:
  - platform: esphome
